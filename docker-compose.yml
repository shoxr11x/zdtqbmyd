# Запуск:
#     docker compose up -d --build
# Посмотреть журнал:
#     docker compose logs -f
#
# Порты выбраны так, чтобы не задеть MES-систему, которая крутится в Docker на
# этой же машине. Занято ею: 80, 443, 1883, 5432, 6379, 8000-8004, 8090,
# 9000-9001. Особенно 8090 — его публикует zigbee2mqtt, и раньше Vision брал
# именно его: оба захвата проходили (MES садился на IPv6, Vision на IPv4), и
# кто ответит, зависело от того, во что разрешится адрес.

services:
  vision:
    build: .
    image: vision-yolo
    container_name: vision
    restart: unless-stopped

    ports:
      - "8010:8010"    # панель, разметка и API /api/v1 — для этой сети
      - "8011:8011"    # http, только перенаправляет на https
      - "8443:8443"    # https — сюда ходит телефон, там работает его камера

    environment:
      # Настоящий адрес компьютера в сети. Контейнер своего не знает — у него
      # внутренний 172.x.x.x, телефону он бесполезен. Отсюда берётся и адрес
      # в подсказке, и адрес внутри сертификата. Задаётся в файле .env
      HOST_IP: ${HOST_IP:-}
      VISION_DATA: /app/data
      # Часовой пояс. Без него контейнер живёт по UTC, и поле time в API
      # отстаёт от заводского времени на пять часов — MES принял бы события
      # прошлой смены за текущую.
      TZ: Asia/Tashkent

    volumes:
      - ./data:/app/data         # счёт, выбранная модель, доступы, журнал событий
      - ./models:/app/models     # обученные модели — переживают пересборку
      - ./certs:/app/certs       # сертификат выписывается один раз
      - ./dataset:/app/dataset   # кадры и разметка
      - ./runs:/app/runs         # ход обучения, веса и графики качества

    # Проброс видеокарты. Без него обучение и распознавание уедут на процессор:
    # работать будет, но в разы медленнее.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Общая память. Ultralytics грузит данные несколькими процессами, а по
    # умолчанию контейнеру даётся 64 МБ — на обучении это падает с
    # «DataLoader worker killed».
    shm_size: 2gb
